name: Bug report
description: Something in the compiler or CLI does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: Eigrel program
      description: The smallest .eig program that reproduces the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and its full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `eigrel --version` and `python --version`.
      placeholder: eigrel 0.1.0, Python 3.14.0
    validations:
      required: true
