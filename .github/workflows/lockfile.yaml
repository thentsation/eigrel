name: lockfile

# Dependabot does not understand uv lockfiles, so this regenerates config/requirements.lock
# every week and opens a pull request when pinned versions changed.

on:
  schedule:
    - cron: '0 11 * * 1' # Mondays 08:00 BRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: update lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Regenerate lockfile
        run: uv pip compile config/requirements.txt --output-file=config/requirements.lock --universal

      - name: Audit the new lockfile
        id: audit
        run: |
          if uvx pip-audit==2.10.1 -r config/requirements.lock; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=vulnerable" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          branch: deps/lockfile-update
          delete-branch: true
          title: 'chore(deps): update lockfile'
          commit-message: 'chore(deps): update lockfile'
          labels: dependencies
          body: |
            Regenerated `config/requirements.lock` with `uv pip compile`.

            pip-audit: ${{ steps.audit.outputs.status }}
