name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Find the latest release not yet on PyPI
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No release tag yet, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/eigrel/${TAG#v}/json")
          if [ "$CODE" = "200" ]; then
            echo "$TAG is already on PyPI."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag
        if: steps.tag.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Python
        if: steps.tag.outputs.publish == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build sdist and wheel
        if: steps.tag.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish with trusted publishing
        if: steps.tag.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
