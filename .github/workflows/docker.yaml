name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: eigrel:ci

      - name: Smoke test the CLI inside the image
        run: |
          docker run --rm eigrel:ci --version
          docker run --rm -v "$PWD/examples:/work" eigrel:ci check hello.eig pipeline.eig ml.eig regression.eig
          docker run --rm -v "$PWD/examples:/work" eigrel:ci run ml.eig

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eigrel:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: '**/site-packages/pip/_vendor'
          exit-code: '1'
