version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies, github-actions]

  - package-ecosystem: pip
    directory: /config
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies, python]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies, docker]
