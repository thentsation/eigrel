[build-system]
requires = ['setuptools>=80']
build-backend = 'setuptools.build_meta'

[project]
name = 'eigrel'
version = "0.6.1"
description = 'A programming language for Data, Machine Learning and AI.'
readme = 'README.md'
requires-python = '>=3.13'
license = 'Apache-2.0'
license-files = ['LICENSE']
authors = [{ name = 'Nathan Souza' }]
dependencies = []
keywords = ['programming-language', 'compiler', 'data-engineering', 'machine-learning', 'mlops', 'dsl']
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development :: Compilers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]

[project.optional-dependencies]
# What `eigrel run` needs, by data source: `python` always, plus `sql` or `bigquery` when used.
python = ['pandas>=3.0,<3.1', 'scikit-learn>=1.9,<1.10', 'pyarrow>=25,<26']
sql = ['sqlalchemy>=2.1,<2.2']
bigquery = ['google-cloud-bigquery>=3.46,<4', 'db-dtypes>=1.7,<2']
# `eigrel run --target spark`; Spark also needs Java 17 or newer.
spark = ['pyspark>=4.2,<4.3']
# `model ... = xgboost` and `register` (MLflow).
xgboost = ['xgboost>=3.4,<4']
mlflow = ['mlflow>=3.16,<4']

[project.urls]
Homepage = 'https://github.com/thentsation/eigrel'
Documentation = 'https://github.com/thentsation/eigrel/blob/main/docs/LANGUAGE.md'
Issues = 'https://github.com/thentsation/eigrel/issues'
Changelog = 'https://github.com/thentsation/eigrel/blob/main/CHANGELOG.md'

[project.scripts]
eigrel = 'eigrel.cli:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.semantic_release]
tag_format = 'v{version}'
commit_message = 'chore(release): v{version} [skip ci]'
commit_author = 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
version_toml = ['pyproject.toml:project.version']
version_variables = ['src/eigrel/__init__.py:__version__']
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = 'main'

[tool.semantic_release.remote]
# Push with the deploy key set up by the checkout, which may bypass the main branch ruleset.
ignore_token_for_push = true

[tool.ruff]
target-version = 'py313'
line-length = 100
extend-exclude = ['*.md']

[tool.ruff.lint]
extend-select = ['I', 'UP', 'B']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.14'
files = ['src']
mypy_path = 'src'
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
